
name: Docker Hub - TorresAna

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_TORRESANA }}
          password: ${{ secrets.DOCKERHUB_TOKEN_TORRESANA }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile-TorresAna/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            anatorresmartinez/estudiante-sqlserver:latest
            anatorresmartinez/estudiante-sqlserver:${{ github.sha }}
